<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reclamos | Municipalidad de Valle Viejo</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --primary: #429aed;
      --primary-dark: #1b305e;
      --success: #4caf50;
      --error: #f44336;
      --gray: #f5f5f5;
      --text: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e8f5e8 0%, #f1f8e9 100%);
      min-height: 100vh;
      padding: 20px 0;
      color: var(--text);
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
      animation: fadeInUp 0.8s ease-out;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header img {
      width: 150px;
      height: auto;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .form-container {
      padding: 40px 30px;
    }

    h2 {
      text-align: center;
      color: var(--text);
      margin-bottom: 30px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(66, 154, 237, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(to right, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(66, 154, 237, 0.4);
    }

    /* ==================== MODAL / POPUP ==================== */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.3s ease-out;
    }

    .modal-content {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: modalPop 0.4s ease-out forwards;
    }

    .modal-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .success-icon { color: var(--success); }
    .error-icon { color: var(--error); }

    .modal-content h3 {
      margin: 15px 0;
      font-size: 24px;
    }

    .modal-content p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .close-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .close-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalPop {
      to {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .form-container { padding: 30px 20px; }
      .header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="https://test-web.valleviejo.gob.ar/assets/valle-viejo-cuidad-negativo.png" alt="Logo Municipalidad">
      <h1>Reclamos Vecinales</h1>
    </div>

    <div class="form-container">
      <form id="reclamoForm">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required placeholder="Juan Pérez" />
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono / Celular</label>
          <input type="text" id="telefono" required placeholder="3834123456" />
        </div>

        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" required placeholder="Facundo Segura 100, San Isidro" />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo de reclamo</label>
          <select id="tipo" required>
            <option value="" disabled selected>Seleccionar tipo</option>
            <option value="Recolección">Recolección</option>
            <option value="Desarrollo Social">Desarrollo social</option>
            <option value="Obra Pública">Obra pública</option>
            <option value="Alumbrado Público">Alumbrado público</option>
            <option value="Bacheo">Bacheo</option>
            <option value="Obra y Desmalezamiento">Obra y desmalezamiento</option>
            <option value="Cloacas">Cloacas</option>
            <option value="Tránsito">Tránsito</option>
            <option value="Salud">Salud</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción del reclamo</label>
          <textarea id="descripcion" required placeholder="Detalla tu reclamo lo más claro posible..."></textarea>
        </div>

        <button type="submit">
          Enviar Reclamo
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== MODAL ==================== -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div id="modalIcon" class="modal-icon"></div>
      <h3 id="modalTitle">¡Éxito!</h3>
      <p id="modalMessage">Tu reclamo ha sido enviado correctamente.</p>
      <button class="close-btn" onclick="closeModal()">Aceptar</button>
    </div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwBRJ0jFu9D4NSy2aRcWh1A9OKbSrDiWXtgDXVjgsLIEB_HnqTdPila6k_SsPR0ZmoY/exec";
    const form = document.getElementById("reclamoForm");
    const modal = document.getElementById("resultModal");
    const modalIcon = document.getElementById("modalIcon");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");

    function openModal(type, title, message) {
      modal.style.display = "block";
      modalIcon.innerHTML = type === "success" 
        ? '<i class="fas fa-check-circle"></i>' 
        : '<i class="fas fa-exclamation-triangle"></i>';
      modalIcon.className = "modal-icon " + (type === "success" ? "success-icon" : "error-icon");
      modalTitle.textContent = title;
      modalMessage.textContent = message;
    }

    function closeModal() {
      modal.style.display = "none";
    }

    // Cerrar al hacer clic fuera del modal
    window.onclick = function(e) {
      if (e.target === modal) closeModal();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // Mostrar carga en el botón (opcional)
      const submitBtn = form.querySelector("button");
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = `Enviando...`;
      submitBtn.disabled = true;

      const data = {
        nombre: document.getElementById("nombre").value.trim(),
        telefono: document.getElementById("telefono").value.trim(),
        direccion: document.getElementById("direccion").value.trim(),
        tipo: document.getElementById("tipo").value,
        descripcion: document.getElementById("descripcion").value.trim(),
      };

      try {
        await fetch(scriptURL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        // ÉXITO
        openModal(
          "success",
          "¡Reclamo enviado con éxito!",
          "Gracias por tu colaboración. Tu solicitud será atendida a la brevedad por el área correspondiente."
        );
        form.reset();

      } catch (err) {
        // ERROR
        openModal(
          "error",
          "Error al enviar",
          "Hubo un problema al enviar tu reclamo. Por favor, intentá nuevamente o acercate a la Municipalidad."
        );
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
